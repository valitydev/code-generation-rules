# Copy into .github/workflows/ of a consuming project.
name: agent-rules drift

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check agent guidance is in sync
        run: ./.agent-rules/check.sh
